<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141130">
<meta name="description" content="0-99 숫자 페그. 숫자를 누르면 그림으로 떠오릅니다.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="숫자 페그">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>숫자 페그</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #141130;            /* 짙은 남보라 */
    --panel: #1e1a45;
    --panel-2: #292255;
    --edge: #423a80;
    --ink: #f1edff;
    --muted: #9c95c8;
    --gold: #e2bb60;
    --gold-ink: #201703;
    --parchment: #f3e8d0;
    --gap: clamp(6px, 1.6vw, 12px);
    --pad-h: clamp(220px, 40vh, 380px);
    --col: 540px;              /* 큰 화면에서 가운데로 모으는 폭 */
  }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .lhs { display: contents; }
  header, #stage, #display, #pad { width: 100%; max-width: var(--col); margin-inline: auto; }

  /* ── 헤더 ─────────────────────────────────────────── */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 6px var(--gap) 2px;
  }
  .brand { font-size: clamp(12px, 3.2vw, 15px); font-weight: 700; letter-spacing: -.02em; color: var(--muted); }
  .brand b { color: var(--ink); }
  #mode {
    appearance: none; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: clamp(11px, 3vw, 14px); font-weight: 700; cursor: pointer;
  }
  #mode[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .hbtns { display: flex; gap: 6px; }
  .hbtns button {
    appearance: none; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: clamp(11px, 3vw, 14px); font-weight: 700; cursor: pointer;
  }
  .hbtns button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .hbtns button[hidden] { display: none; }

  /* ── 게임 ─────────────────────────────────────────── */
  #stage.game { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 8px; }
  .glist { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; }
  .grow {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--edge); cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .grow.sel { border-color: var(--gold); background: #2b2555; }
  .grow .gi { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2);
    color: var(--muted); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .grow.sel .gi { background: var(--gold); color: var(--gold-ink); }
  .grow .gn { flex: 1 1 auto; font-size: clamp(20px, 6vw, 28px); font-weight: 900; letter-spacing: .06em; display: flex; gap: .3em; }
  .grow .gn .grp:nth-child(even) { color: var(--gold); }
  .grow .gn .ph { color: #4d4488; font-size: .7em; letter-spacing: 0; font-weight: 700; }
  .grow .ga { font-size: clamp(14px, 4vw, 18px); font-weight: 800; letter-spacing: .05em; color: var(--muted); }
  .grow .ga.ok { color: #6fd39a; }
  .grow .ga.ng { color: #ff7a7a; text-decoration: line-through; }
  .grow .gmark { flex: 0 0 auto; font-size: 18px; font-weight: 900; }
  .grow .gmark.ok { color: #6fd39a; } .grow .gmark.ng { color: #ff7a7a; }
  .gcards .card { max-height: 100%; }
  .gcards { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; gap: var(--gap); }
  .gmsg { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    text-align: center; color: var(--muted); font-size: clamp(13px, 3.6vw, 16px); line-height: 1.6; }
  .gmsg b { color: var(--ink); font-size: 1.15em; }
  .gmsg .score { font-size: clamp(26px, 8vw, 40px); font-weight: 900; color: var(--gold); }

  /* ── 카드 ─────────────────────────────────────────── */
  #stage {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    gap: var(--gap); padding: 0 var(--gap);
  }
  .card {
    flex: 1 1 0; min-width: 0; min-height: 0;
    aspect-ratio: 1 / 1.72; max-height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    box-shadow: 0 6px 20px #0000005e;
    overflow: hidden; animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
  [data-n="1"] .card { flex: 0 0 auto; width: 62%; }

  .card .pic {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); padding: 0;
  }
  .card img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* 이미지가 아직 없을 때(생성 전) 자리표시 */
  .card .fallback {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 2px; background: var(--panel-2);
    font-weight: 800; text-align: center; padding: 4px; line-height: 1.15;
  }
  .card .fallback .fnum { font-size: clamp(26px, 10vw, 60px); color: var(--gold); letter-spacing: -.04em; }
  .card .fallback .fhint { font-size: clamp(9px, 2.4vw, 12px); font-weight: 600; color: var(--muted); }
  .card.noimg .pic { background: var(--panel-2); padding: 0; }
  .card.noimg img { display: none; }
  .card.noimg .fallback { display: flex; }

  .card .cap {
    flex: 0 0 auto; display: flex; align-items: baseline; justify-content: center;
    gap: 6px; padding: 6px 6px 8px; border-top: 1px solid var(--edge);
  }
  .card .num {
    font-size: clamp(14px, 4.4vw, 21px); font-weight: 900; color: var(--gold);
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  }
  .card .label {
    font-size: clamp(12px, 3.8vw, 18px); font-weight: 800; letter-spacing: -.03em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  /* 카드 3장이면 폭이 좁으니 숫자 위·키워드 아래로 쌓고, 긴 키워드는 두 줄까지 */
  [data-n="3"] .card .cap { flex-direction: column; align-items: center; gap: 0; padding: 4px 4px 6px; }
  [data-n="3"] .card .num { font-size: clamp(12px, 3.6vw, 17px); line-height: 1.1; }
  [data-n="3"] .card .label {
    font-size: clamp(11px, 3.2vw, 15px); line-height: 1.2; text-align: center;
    white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* 퀴즈 모드에서 아직 안 보여준 카드 */
  .qmark { display: none; }
  .card.hidden .pic { background: var(--panel-2); }
  .card.hidden img { display: none; }
  .card.hidden.noimg .fallback { display: none; }
  .card.hidden .cap .label { color: var(--muted); }
  .card.hidden .qmark {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; font-size: clamp(36px, 14vw, 80px); font-weight: 900; color: #5a52a0;
  }

  /* 아무것도 안 눌렀을 때 */
  #hint {
    flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; color: var(--muted); padding: 0 20px;
  }
  #hint .big { font-size: clamp(15px, 4.4vw, 21px); font-weight: 800; color: var(--ink); letter-spacing: -.03em; }
  #hint .sub { font-size: clamp(12px, 3.3vw, 15px); line-height: 1.65; }
  #hint .sub b { color: var(--gold); font-variant-numeric: tabular-nums; }

  /* ── 입력 표시 ────────────────────────────────────── */
  #display {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: .35em;
    height: clamp(40px, 7vh, 56px); margin-top: var(--gap);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    font-size: clamp(24px, 8vw, 38px); font-weight: 900; letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    width: calc(100% - var(--gap) * 2); max-width: calc(var(--col) - var(--gap) * 2);
  }
  #display { position: relative; }
  #digits { display: flex; align-items: center; gap: .35em; }
  #display .ph { color: #4d4488; font-size: .6em; letter-spacing: 0; }
  /* 오른쪽 작은 새로고침(전체 지우기) 버튼 */
  #reset {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: clamp(34px, 9vw, 44px); height: clamp(34px, 9vw, 44px); border-radius: 50%;
    border: 2px solid var(--gold); background: #2b2555; color: var(--gold);
    line-height: 1; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px #e2bb6022;
  }
  #reset:active { background: var(--gold); color: var(--gold-ink); }
  #reset[disabled] { opacity: .25; box-shadow: none; }
  #display .grp:nth-child(even) { color: var(--gold); }
  #display .score-inline { color: var(--gold); }

  /* ── 키패드 ───────────────────────────────────────── */
  #pad {
    flex: 0 0 auto; height: var(--pad-h);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr;
    gap: var(--gap); padding: var(--gap);
  }
  #pad button {
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 14px;
    font-family: inherit; font-size: clamp(24px, 8vw, 38px); font-weight: 800;
    letter-spacing: -.02em; cursor: pointer; padding: 0;
    transition: transform .06s ease, background .12s ease;
  }
  #pad button:active { transform: scale(.95); background: #352d68; }
  #pad button.fn { font-size: clamp(19px, 6vw, 28px); background: var(--panel); color: var(--muted); }
  #pad button.fn:active { background: #241f4c; }
  #pad button.enter { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  #pad button.enter:active { background: #cba54f; }
  #pad button:disabled { opacity: .35; }

  /* 카드를 누르면 크게 보기 */
  #zoom {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #141130f2; padding: 12px;
    animation: fade .15s ease-out;
  }
  #zoom[hidden] { display: none; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  #zoom img { max-width: 100%; max-height: 84vh; border-radius: 10px; box-shadow: 0 10px 40px #000a; }
  #zoom .zcap { font-size: clamp(16px, 5vw, 24px); font-weight: 800; letter-spacing: -.03em; }
  #zoom .zcap b { color: var(--gold); margin-right: .35em; font-variant-numeric: tabular-nums; }
  #zoom .zhint { font-size: 12px; color: var(--muted); }
  #zoom .how { font-size: .6em; font-weight: 700; color: var(--muted); border: 1px solid var(--edge); border-radius: 999px; padding: 2px 8px; margin-left: .4em; vertical-align: middle; }

  /* 가로 모드: 카드는 왼쪽, 키패드는 오른쪽 */
  @media (orientation: landscape) and (max-height: 560px) {
    body { flex-direction: row; }
    .lhs { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; max-width: none; }
    header, #stage, #display { max-width: none; }
    #pad { height: auto; width: min(44vw, 320px); max-width: none; margin: 0; }
  }
</style>
</head>
<body>

<div class="lhs">
  <header>
    <div class="brand"><b>숫자 페그</b> · 모양(0–9) · 소리(00–99)</div>
    <div class="hbtns">
      <button id="gameopt" type="button" aria-pressed="true" hidden>카드</button>
      <button id="mode" type="button" aria-pressed="false">즉시</button>
      <button id="gamebtn" type="button" aria-pressed="false">게임</button>
    </div>
  </header>

  <section id="stage" aria-live="polite"></section>

  <div id="display"><span id="digits"><span class="ph">숫자를 누르세요</span></span><button id="reset" type="button" aria-label="처음부터" title="처음부터"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg></button></div>
</div>

<div id="pad"></div>

<div id="zoom" hidden>
  <img alt="">
  <div class="zcap"></div>
  <div class="zhint">아무 데나 누르면 닫힘</div>
</div>

<script>
(async () => {
  "use strict";

  const MAX_DIGITS = 6;                 // 최대 카드 3장
  const PEGS_URL = "data/pegs.json";    // 숫자 → 키워드. 목록은 전부 여기서 온다
  let PEGS = {};
  const stage = document.getElementById("stage");
  const display = document.getElementById("digits");
  const resetBtn = document.getElementById("reset");
  const pad = document.getElementById("pad");
  const modeBtn = document.getElementById("mode");
  const gameBtn = document.getElementById("gamebtn");
  const gameOpt = document.getElementById("gameopt");

  let digits = "";
  let quiz = localStorage.getItem("peg.quiz") === "1";
  const revealed = new Set();           // 퀴즈 모드에서 공개된 카드 index
  let game = null;                      // 게임 상태 (null 이면 자유 모드)

  /* 8396 → ["83","96"],  542 → ["5","42"] : 홀수면 맨 앞만 한 자리 */
  function chunk(s) {
    const out = [];
    let i = 0;
    if (s.length % 2 === 1) { out.push(s[0]); i = 1; }
    for (; i < s.length; i += 2) out.push(s.slice(i, i + 2));
    return out;
  }

  const imgSrc = (key) => `img/${key.length}/${key}.webp`;

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* 숫자를 청크별로 색 구분해서 span 으로 */
  function groupedHtml(s) {
    return chunk(s).map((c) => `<span class="grp">${c}</span>`).join("");
  }

  /* ── 카드 한 장 ───────────────────────────────────── */
  function makeCard(key, { hide = false, onClick = null } = {}) {
    const label = PEGS[key] || "?";
    const card = document.createElement("div");
    card.className = "card" + (hide ? " hidden" : "");

    const pic = document.createElement("div");
    pic.className = "pic";

    const img = document.createElement("img");
    img.alt = `${key} ${label}`;
    img.decoding = "async";
    img.src = imgSrc(key);
    img.addEventListener("error", () => card.classList.add("noimg"), { once: true });

    const fb = document.createElement("div");
    fb.className = "fallback";
    fb.innerHTML = `<div class="fnum">${key}</div><div class="fhint">그림 생성 전</div>`;

    const qm = document.createElement("div");
    qm.className = "qmark";
    qm.textContent = "?";

    pic.append(img, fb, qm);

    const cap = document.createElement("div");
    cap.className = "cap";
    cap.innerHTML = `<span class="num">${key}</span>` +
                    `<span class="label">${hide ? "???" : escapeHtml(label)}</span>`;

    card.append(pic, cap);
    if (onClick) card.addEventListener("click", onClick);
    else if (!hide && PEGS[key]) card.addEventListener("click", () => openZoom(key, label));
    return card;
  }

  /* 여러 장을 한 줄로 */
  function fillCards(container, keys, opts = {}) {
    container.innerHTML = "";
    container.dataset.n = String(keys.length);
    keys.forEach((key, idx) => container.appendChild(makeCard(key, typeof opts === "function" ? opts(key, idx) : opts)));
  }

  /* ── 자유 모드 그리기 ──────────────────────────────── */
  function render() {
    if (game) return renderGame();
    stage.classList.remove("game");
    const chunks = chunk(digits);

    display.innerHTML = chunks.length ? groupedHtml(digits) : '<span class="ph">숫자를 누르세요</span>';

    stage.innerHTML = "";
    stage.dataset.n = String(chunks.length);
    if (!chunks.length) {
      stage.innerHTML =
        '<div id="hint">' +
          '<div class="big">숫자를 누르면 그림이 뜹니다</div>' +
          '<div class="sub">한 자리는 숫자의 <b>모양</b>, 두 자리는 숫자의 <b>소리</b>로 페그를 정했습니다<br><br>' +
          '<b>8396</b> → 빨간 삼각팬티 + 구루<br>' +
          '<b>542</b> → 갈고리 + 싸이<br>' +
          '홀수 자리는 맨 앞 한 자리부터 끊습니다</div>' +
        '</div>';
      return;
    }

    chunks.forEach((key, idx) => {
      const hide = quiz && !revealed.has(idx);
      stage.appendChild(makeCard(key, {
        hide,
        onClick: hide ? () => { revealed.add(idx); render(); } : null,
      }));
    });
  }

  /* ── 게임 ─────────────────────────────────────────── */
  function randomNumber() {
    const n = 3 + Math.floor(Math.random() * 3);          // 3~5자리
    let s = String(1 + Math.floor(Math.random() * 9));     // 첫 자리는 0 제외
    while (s.length < n) s += String(Math.floor(Math.random() * 10));
    return s;
  }

  function newGame() {
    game = {
      stage: "study",                                       // study → answer → result
      showCards: localStorage.getItem("peg.gamecards") !== "0",
      problems: [randomNumber(), randomNumber(), randomNumber()],
      answers: ["", "", ""],
      sel: 0,
    };
    digits = "";
    syncHeader();
    syncPad();
    render();
  }

  function endGame() {
    game = null;
    digits = "";
    syncHeader();
    syncPad();
    render();
  }

  function renderGame() {
    const g = game;
    stage.classList.add("game");
    stage.innerHTML = "";
    delete stage.dataset.n;

    // 위: 문제 목록
    const list = document.createElement("div");
    list.className = "glist";
    g.problems.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "grow" + (i === g.sel ? " sel" : "");
      let inner = `<span class="gi">${i + 1}</span>`;
      if (g.stage === "study") {
        inner += `<span class="gn">${groupedHtml(p)}</span>`;
      } else if (g.stage === "answer") {
        const a = g.answers[i];
        inner += i < g.sel
          ? `<span class="gn">${groupedHtml(a)}</span>`
          : i === g.sel
            ? `<span class="gn">${digits ? groupedHtml(digits) : '<span class="ph">입력 중…</span>'}</span>`
            : `<span class="gn"><span class="ph">${"·".repeat(p.length)}</span></span>`;
      } else {
        const ok = g.answers[i] === p;
        inner += `<span class="gn">${groupedHtml(p)}</span>` +
                 `<span class="ga ${ok ? "ok" : "ng"}">${escapeHtml(g.answers[i] || "—")}</span>` +
                 `<span class="gmark ${ok ? "ok" : "ng"}">${ok ? "✓" : "✗"}</span>`;
      }
      row.innerHTML = inner;
      if (g.stage !== "answer") row.addEventListener("click", () => { g.sel = i; render(); });
      list.appendChild(row);
    });
    stage.appendChild(list);

    // 아래: 카드 또는 안내
    if (g.stage === "study") {
      if (g.showCards) {
        const cards = document.createElement("div");
        cards.className = "gcards";
        fillCards(cards, chunk(g.problems[g.sel]));
        stage.appendChild(cards);
      } else {
        stage.insertAdjacentHTML("beforeend",
          '<div class="gmsg"><b>숫자만 보고 외우세요</b>카드 없이 머릿속으로 그림을 떠올리는 연습<br>다 외웠으면 ⏎</div>');
      }
      display.innerHTML = '<span class="ph">외운 뒤 ⏎ 를 누르세요</span>';
    } else if (g.stage === "answer") {
      stage.insertAdjacentHTML("beforeend",
        `<div class="gmsg"><b>${g.sel + 1}번 숫자를 입력하세요</b>카드 없이 기억만으로<br>다 쳤으면 ⏎</div>`);
      display.innerHTML = digits ? groupedHtml(digits) : `<span class="ph">${g.sel + 1}번 답</span>`;
    } else {
      const score = g.problems.filter((p, i) => g.answers[i] === p).length;
      const cards = document.createElement("div");
      cards.className = "gcards";
      fillCards(cards, chunk(g.problems[g.sel]));
      stage.appendChild(cards);
      display.innerHTML = `<span class="score-inline">${score} / 3</span><span class="ph">&nbsp; ⏎ 새 문제</span>`;
    }
  }

  function gamePress(key) {
    const g = game;
    if (key === "clear") { tap(20); newGame(); return; }

    if (g.stage === "study") {
      if (key === "enter") { g.stage = "answer"; g.sel = 0; digits = ""; tap(16); }
      else { tap(30); return; }
    } else if (g.stage === "answer") {
      if (key === "back") { if (!digits) return; digits = digits.slice(0, -1); tap(8); }
      else if (key === "enter") {
        if (!digits) { tap(30); return; }
        g.answers[g.sel] = digits;
        digits = "";
        g.sel++;
        if (g.sel >= 3) { g.stage = "result"; g.sel = 0; }
        tap(16);
      } else {
        if (digits.length >= MAX_DIGITS) { tap(30); return; }
        digits += key; tap(8);
      }
    } else {
      if (key === "enter") { tap(16); newGame(); return; }
      tap(30); return;
    }
    syncPad();
    render();
  }

  /* ── 크게 보기 ────────────────────────────────────── */
  const zoom = document.getElementById("zoom");
  function openZoom(key, label) {
    const img = zoom.querySelector("img");
    img.src = imgSrc(key);
    img.alt = `${key} ${label}`;
    const how = key.length === 1 ? "모양" : "소리";
    zoom.querySelector(".zcap").innerHTML = `<b>${key}</b>${escapeHtml(label)} <span class="how">${how}</span>`;
    zoom.hidden = false;
  }
  zoom.addEventListener("click", () => { zoom.hidden = true; });

  /* ── 입력 ─────────────────────────────────────────── */
  const tap = (ms) => { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

  function press(key) {
    if (game) return gamePress(key);
    if (key === "back") {
      if (!digits) return;
      digits = digits.slice(0, -1);
      revealed.clear();
      tap(8);
    } else if (key === "enter") {
      if (quiz && digits && revealed.size < chunk(digits).length) {
        chunk(digits).forEach((_, i) => revealed.add(i));   // 첫 엔터: 정답 공개
      } else {
        digits = "";                                        // 다음 숫자로
        revealed.clear();
      }
      tap(16);
    } else if (key === "clear") {
      digits = "";
      revealed.clear();
      tap(20);
    } else {
      if (digits.length >= MAX_DIGITS) { tap(30); return; }
      digits += key;
      revealed.clear();
      tap(8);
    }
    syncPad();
    render();
  }

  function syncPad() {
    const nums = pad.querySelectorAll("button[data-num]");
    const back = pad.querySelector('[data-key="back"]');
    if (game) {
      const typing = game.stage === "answer";
      nums.forEach((b) => { b.disabled = !typing || digits.length >= MAX_DIGITS; });
      back.disabled = !typing || !digits;
      resetBtn.disabled = false;                             // 게임에서는 ↻ = 새 문제
      return;
    }
    const full = digits.length >= MAX_DIGITS;
    nums.forEach((b) => { b.disabled = full; });
    back.disabled = !digits;
    resetBtn.disabled = !digits;
  }
  resetBtn.addEventListener("click", () => press("clear"));

  /* ── 키패드 ───────────────────────────────────────── */
  const layout = [["1","2","3"], ["4","5","6"], ["7","8","9"], ["back","0","enter"]];
  for (const row of layout) {
    for (const k of row) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.key = k;
      if (k === "back") {
        b.className = "fn"; b.textContent = "⌫";
        b.setAttribute("aria-label", "한 자리 지우기 (길게 누르면 전체 삭제)");
        let timer = null;
        b.addEventListener("pointerdown", () => { timer = setTimeout(() => { timer = null; press("clear"); }, 500); });
        b.addEventListener("pointerup", (e) => { if (timer) { clearTimeout(timer); timer = null; press("back"); } e.preventDefault(); });
        const cancel = () => { clearTimeout(timer); timer = null; };
        b.addEventListener("pointerleave", cancel);
        b.addEventListener("pointercancel", cancel);
      } else if (k === "enter") {
        b.className = "fn enter"; b.textContent = "⏎";
        b.setAttribute("aria-label", "확인");
        b.addEventListener("click", () => press("enter"));
      } else {
        b.dataset.num = k; b.textContent = k;
        b.addEventListener("click", () => press(k));
      }
      pad.appendChild(b);
    }
  }

  /* ── 헤더 버튼 ────────────────────────────────────── */
  function syncHeader() {
    modeBtn.textContent = quiz ? "퀴즈" : "즉시";
    modeBtn.setAttribute("aria-pressed", String(quiz));
    modeBtn.title = quiz ? "숫자를 다 누르고 ⏎ 를 눌러야 그림이 열립니다" : "누르는 대로 바로 그림이 열립니다";
    modeBtn.hidden = !!game;
    gameBtn.setAttribute("aria-pressed", String(!!game));
    gameBtn.title = game ? "게임 끝내기" : "무작위 숫자 3개 외우기";
    gameOpt.hidden = !(game && game.stage === "study");
    if (game) {
      gameOpt.textContent = game.showCards ? "카드" : "숫자만";
      gameOpt.setAttribute("aria-pressed", String(game.showCards));
      gameOpt.title = game.showCards ? "카드를 보며 외웁니다 (누르면 숫자만)" : "숫자만 보고 외웁니다 (누르면 카드)";
    }
  }
  modeBtn.addEventListener("click", () => {
    quiz = !quiz;
    localStorage.setItem("peg.quiz", quiz ? "1" : "0");
    revealed.clear();
    syncHeader();
    render();
  });
  gameBtn.addEventListener("click", () => { game ? endGame() : newGame(); });
  gameOpt.addEventListener("click", () => {
    if (!game) return;
    game.showCards = !game.showCards;
    localStorage.setItem("peg.gamecards", game.showCards ? "1" : "0");
    syncHeader();
    render();
  });

  /* 물리 키보드 (데스크톱) */
  addEventListener("keydown", (e) => {
    if (!zoom.hidden) { if (e.key === "Escape" || e.key === "Enter") zoom.hidden = true; return; }
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("back"); }
    else if (e.key === "Enter") press("enter");
    else if (e.key === "Escape") press("clear");
  });

  /* ── 페그 목록 불러오기 ───────────────────────────── */
  syncHeader();
  stage.innerHTML = '<div id="hint"><div class="big">페그 목록을 불러오는 중…</div></div>';
  try {
    const res = await fetch(PEGS_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    PEGS = await res.json();
  } catch (err) {
    pad.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    gameBtn.disabled = true;
    stage.innerHTML =
      '<div id="hint">' +
        '<div class="big">페그 목록을 불러오지 못했습니다</div>' +
        `<div class="sub"><b>${escapeHtml(PEGS_URL)}</b> — ${escapeHtml(String(err.message || err))}<br><br>` +
        '파일을 그냥 더블클릭해서 열면 브라우저가 JSON 읽기를 막습니다.<br>' +
        '간단한 웹서버로 여세요: <b>npx http-server docs</b></div>' +
      '</div>';
    return;
  }

  syncPad();
  render();
})();
</script>
</body>
</html>
